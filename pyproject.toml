[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "semanticrouter"
version = "0.1.0"
description = "Router configuration adapters, a vendor-neutral semantic model, and configuration policy tests"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Leo Brown"}]
dependencies = []

[project.scripts]
semanticrouter = "semanticrouter.cli:main"

[tool.setuptools.packages.find]
include = ["semanticrouter*"]

[tool.setuptools.package-data]
semanticrouter = ["firmware/*.json"]

[project.urls]
Repository = "https://github.com/leo-brown/semanticrouter"
Issues = "https://github.com/leo-brown/semanticrouter/issues"

[project.optional-dependencies]
dev = ["ruff==0.17.3", "build>=1.2"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
